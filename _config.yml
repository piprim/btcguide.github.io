defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude: 
  - dictionary.dic
  - fr  # French sources, read only by _book/ (see _book/FRENCH-SPEC.md)

# https://github.com/jekyll/jekyll/issues/920#issuecomment-315503935
collections:
  pages:
    output: true
    permalink: /:path
